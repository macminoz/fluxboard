mercato:
  nome: Spazio disco (Proxmox)
  descrizione: Nodi, LXC e storage (anche il NAS montato in Proxmox) sopra l'80% di occupazione, in rosso sopra il 90%
  genere: correlazione
  icona: server
  sorgente: proxmox
  parametri: []
tile:
  titolo: Spazio disco
  tipo: elenco
  etichetta: infrastruttura
  icona: server
  priorita: 75
  larghezza: media
  ogni: 10m
  scadenza: 1h
  mostra_se: dati
  colore_se:
    "percentuale >= 90": { colore: rosso, sfondo: true }
    "percentuale >= 80": { colore: giallo, sfondo: false }
  dati:
    sorgente: "{{sorgente}}"
    risorsa: spazio
  elabora:
    - filtra: "percentuale >= 80"
  tabella:
    - { etichetta: Cosa, valore: "{nome}" }
    - { etichetta: Tipo, valore: "{tipo}", livello: intermedia }
    - { etichetta: Occupato, valore: "{percentuale:0}%", tono: { "percentuale >= 90": allarme, "percentuale >= 80": attenzione } }
    - { etichetta: Libero, valore: "{libero_gb:0} GB", livello: intermedia }
    - { etichetta: Su, valore: "{dove}", livello: avanzata }
