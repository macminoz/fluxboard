mercato:
  nome: Una parola nel syslog
  descrizione: Le ultime righe del syslog che contengono una parola (un errore, un host, un servizio); raggruppate (lo stesso messaggio ripetuto è una riga sola); sparisce se non ce ne sono
  genere: messaggi
  icona: nota
  sorgente: logsql
  parametri:
    - { nome: parola, etichetta: Parola o frase da cercare, esempio: error }
    - { nome: periodo, etichetta: Quanto indietro, tipo: durata, esempio: 1h }
tile:
  titolo: "Syslog: {{parola}}"
  tipo: elenco
  priorita: 60
  larghezza: larga
  ogni: 1m
  scadenza: 5m
  mostra_se: dati
  dati:
    sorgente: "{{sorgente}}"
    query: "_time:{{periodo}} \"{{parola}}\" | stats by (host, origine_ip, _msg) count() volte, max(_time) ultimo | sort by (ultimo desc) | limit 10"
  tabella:
    - { etichetta: Quando, valore: "{ultimo:durata} fa", livello: intermedia }
    - { etichetta: Host, valore: "{host|origine_ip:nome}" }
    - { etichetta: Messaggio, valore: "{_msg}" }
    - { etichetta: Volte, valore: "×{volte}", livello: intermedia }
  azioni:
    - { id: ack, etichetta: Ack, tono: ack, operazione: nascondi_riga, chiave: _msg, subito: true, livello: base }
    - { id: ignora, etichetta: Ignora, tono: ignora, operazione: ignora_riga, chiave: _msg, livello: base, conferma: "Sei davvero sicuro di ignorare questo evento?\n\n«{_msg}» sparisce dall'elenco, anche quando si ripete. Resta nello storico della tile (pulsante «Ignorati») per riammetterlo quando l'hai risolto." }
