# Impostazioni della cornice: valgono per tutta la pagina.
titolo: Fluxboard
lingua: it
fuso: Europe/Rome
livello: intermedia # base | intermedia | avanzata (predefinito, ogni display può cambiarlo)
tema: auto # auto | chiaro | scuro
aggiornamento: 1m # ogni quanto rileggere le sorgenti, se la tile non dice altro
editor: true # false = disattiva l'editor web /config

# Etichette: ogni tile ne ha una ("etichetta: temperatura") e da lei prende colore, icona e
# sfondo. Con "sezioni: true" le tile si raggruppano in una sezione per etichetta; l'ordine qui
# sotto è l'ordine delle sezioni e la priorità di "Riordina le tile". Colori disponibili:
# blu azzurro verde giallo arancio rosso viola grigio. "sfondo: true" tinge anche il fondo.
# "icona": termometro fiamma sole nuvola fulmine casa server rete allarme grafico telecamera dns orologio nota
# (La chiave si chiama ancora "argomenti" per compatibilità con le versioni 0.1.)
sezioni: true
argomenti:
  sicurezza:
    colore: blu
    icona: telecamera
  allarmi:
    colore: rosso
    sfondo: true
    icona: allarme
  temperatura:
    colore: arancio
    icona: termometro
  energia:
    colore: giallo
    icona: fulmine
  infrastruttura:
    colore: grigio
    icona: server
  meteo:
    colore: azzurro
    icona: nuvola
  stato:
    colore: verde
    icona: casa
  statistiche:
    colore: viola
    icona: dns
  stream:
    colore: grigio
    icona: telecamera


# Profili dei display. Si scelgono con ?display=<nome>; senza parametro il browser sceglie
# "mobile" sotto i 700 px di larghezza, altrimenti il primo dell'elenco (o quello di una regola
# in "schermi", qui sotto).
display:
  browser:
    colonne: 12 # griglia fine: la larghezza delle tile si regola a passi di 1/12
  mobile:
    colonne: 1
  pannello:
    # touch a muro o tablet da parete: sola lettura e leggero, si scorre col dito
    colonne: 6
    livello: base
    controlli: false # niente selettore di vista né editor
    pannello: true
  eink:
    colonne: 4
    livello: base
    controlli: false

# Chi si collega: un profilo di display per schermo, scelto da Fluxboard senza toccare
# l'indirizzo della pagina. Gli schermi che hanno aperto la pagina, con indirizzo e browser, si
# vedono in Impostazioni → Schermi (e lì si sceglie il profilo con un menu).
# schermi:
#   - { indirizzo: 192.168.1.60, display: pannello }   # IP esatto, o l'inizio ("192.168.1.")
#   - { browser: "Android", display: pannello }        # un pezzo del nome del browser

# Notifiche push quando una tile va in allerta grave (facoltative). Vedi la guida, sezione 5d.
# notifiche:
#   - url: http://192.168.1.40:1880/fluxboard/allerta   # webhook (es. un nodo "http in" di Node-RED)
#   - url: https://ntfy.sh/il-mio-argomento
#     formato: ntfy
