# Settings for the whole page.
title: Fluxboard
language: en          # en | it — interface language (keys in these files work in both)
timezone: Europe/Rome
level: intermediate   # basic | intermediate | advanced (each display can change it)
theme: auto           # auto | light | dark
refresh: 1m           # how often to re-read the sources, unless a tile says otherwise
editor: true          # false = turns off the /config web editor

# Labels: every tile has one ("label: weather") and takes its colour, icon and background from
# it. With "sections: true" tiles are grouped in one section per label; the order below is the
# order of the sections. Colours: blue azure green yellow orange red purple pink cyan indigo
# lime amber brown grey. "background: true" tints the background too.
sections: true
labels:
  alarms:
    colour: red
    background: true
    icon: alarm
  weather:
    colour: azure
    icon: cloud
  infrastructure:
    colour: grey
    icon: server
  home:
    colour: green
    icon: home

# Display profiles. Pick one with ?display=<name>; without it the browser picks "mobile" below
# 700 px of width, otherwise the first in the list (or the one of a rule in "screens" below).
display:
  browser:
    columns: 12        # fine grid: tile widths change in 1/12 steps
  mobile:
    columns: 1
  panel:
    # wall touch panel or tablet: read only and lightweight, scrolled with a finger
    columns: 6
    level: basic
    controls: false    # no view selector, no editor
    panel: true
  eink:
    columns: 4
    level: basic
    controls: false

# Who connects: a display profile per screen, chosen by Fluxboard without touching the page
# address. The screens that opened the page, with address and browser, are listed in
# Settings → Screens (where a profile is picked from a menu).
# screens:
#   - { address: 192.168.1.60, display: panel }   # exact IP, or its start ("192.168.1.")
#   - { browser: "Android", display: panel }      # part of the browser name

# Push notifications when a tile goes into critical alert (optional). See the guide, "Alerts".
# notifications:
#   - url: http://192.168.1.40:1880/fluxboard/alert   # a webhook (e.g. a Node-RED "http in" node)
#   - url: https://ntfy.sh/my-topic
#     format: ntfy
