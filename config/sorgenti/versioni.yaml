# Latest releases on GitHub, compared with the installed versions.
# Without a token: 60 reads an hour. "installed" can be written by hand or read from an address
# (see server/connettori/versioni.js).
type: versions
timeout: 15s
software:
  - name: Grafana
    repo: grafana/grafana
    installed: "10.0.0"
  - name: Node-RED
    repo: node-red/node-red
    installed: "3.0.0"
