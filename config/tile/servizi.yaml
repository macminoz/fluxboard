# Servizi da controllare: Fluxboard prova da sé porte TCP, pagine web e server DNS.
# Sostituisci gli esempi con i servizi della tua rete (vedi la guida, "sonde").
titolo: Servizi critici
tipo: elenco
etichetta: allarmi
icona: server
priorita: 91
larghezza: media
ogni: 1m
scadenza: 5m
colore_se:
  "codice == 0": { colore: rosso, sfondo: true }
  "codice == 2": { colore: giallo, sfondo: false }
avvisi:
  quando: "codice != 1"
  messaggio: "{nome}: {dettaglio}"
  host: "{nome}"
  chiave: "{nome}"
  gravita: { "codice == 0": critico, "codice == 2": attenzione }
dati:
  sorgente: "sonde"
  servizi:
    - { nome: Sito di esempio, gruppo: Internet, http: "https://example.com/" }
    - { nome: DNS pubblico, gruppo: Internet, dns: 1.1.1.1, risolve: example.com }
    - { nome: Porta che non risponde, gruppo: Esempi, tcp: "192.0.2.1:22" }
elabora:
  - ordina: "codice, gruppo, nome"
tabella:
  - { etichetta: Servizio, valore: "{nome}" }
  - { etichetta: Stato, valore: "{stato}", tono: { "codice == 0": allarme, "codice == 2": attenzione, "codice == 1": ok } }
  - { etichetta: Dettaglio, valore: "{dettaglio}", livello: intermedia }
  - { etichetta: Tempo, valore: "{ms} ms", livello: avanzata }
