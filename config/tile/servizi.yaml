# Services to check: Fluxboard itself tries TCP ports, web pages and DNS servers.
# Replace the examples with the services of your network (see the guide, "probes").
title: Critical services
type: list
label: alarms
icon: server
priority: 91
width: medium
every: 1m
stale_after: 5m
colour_if:
  codice == 0:
    colour: red
    background: true
  codice == 2:
    colour: yellow
    background: false
alerts:
  when: codice != 1
  message: "{nome}: {dettaglio}"
  host: "{nome}"
  key: "{nome}"
  severity:
    codice == 0: critical
    codice == 2: warning
data:
  source: sonde
  services:
    - { name: Example site, group: Internet, http: https://example.com/ }
    - { name: Public DNS, group: Internet, dns: 1.1.1.1, resolves: example.com }
    - { name: A port that does not answer, group: Examples, tcp: 192.0.2.1:22 }
process:
  - { sort: "codice, gruppo, nome" }
table:
  - { label: Service, value: "{nome}" }
  - { label: Status, value: "{stato}", tone: { codice == 0: alarm, codice == 2: warning, codice == 1: ok } }
  - { label: Detail, value: "{dettaglio}", level: intermediate }
  - { label: Time, value: "{ms} ms", level: advanced }
