# Weather from Open-Meteo (free, no key): change latitude and longitude to yours.
title: Weather
type: values
label: weather
icon: sun
priority: 95
width: medium
every: 15m
stale_after: 2h
data:
  source: open-meteo
  url: v1/forecast?latitude=41.89&longitude=12.49&current=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=auto
  fields:
    temperature: current.temperature_2m
    rain: current.precipitation_probability
    sky: current.weather_code
    wind: current.wind_speed_10m
process:
  - { map: { sky: { "0": clear, "1": mostly clear, "2": partly cloudy, "3": overcast, "45": fog, "48": freezing fog, "51": drizzle, "53": drizzle, "55": heavy drizzle, "61": light rain, "63": rain, "65": heavy rain, "71": light snow, "73": snow, "75": heavy snow, "80": showers, "81": showers, "82": heavy showers, "95": thunderstorm, "96": thunderstorm with hail, "99": temporale con grandine } } }
items:
  - { label: Now, value: "{temperature:1}°", tone: { temperature < 3: cold, temperature >= 32: hot } }
  - { label: Sky, value: "{sky}" }
  - { label: Rain, value: "{rain}%", level: intermediate, tone: { rain >= 60: info } }
  - { label: Wind, value: "{wind:0} km/h", level: advanced }
