# Software to update: it shows only when a newer version exists.
kind: correlation
title: Updates available
fields:
  data: { source: versioni }
  columns:
    - { label: Software, value: "{nome}" }
    - { label: Installed, value: "{installata}" }
    - { label: Latest, value: "{ultima}" }
  filter: da_aggiornare == true
  highlight: da_aggiornare == true
  sort: nome
label: infrastructure
icon: package
show_if: data
empty: Everything up to date
priority: 70
