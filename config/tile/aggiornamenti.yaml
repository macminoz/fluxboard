# Software da aggiornare: compare solo quando c'è una versione nuova.
genere: correlazione
titolo: Aggiornamenti disponibili
campi:
  dati: { sorgente: versioni }
  colonne:
    - { etichetta: Software, valore: "{nome}" }
    - { etichetta: Installata, valore: "{installata}" }
    - { etichetta: Online, valore: "{ultima}" }
  filtro: da_aggiornare == true
  evidenzia: da_aggiornare == true
  ordina: nome
etichetta: infrastruttura
icona: pacchetto
mostra_se: dati
vuoto: Tutto aggiornato
priorita: 70
